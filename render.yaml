# Render 部署蓝图：https://render.com
# 用法：把项目推到 Git 仓库 → Render 新建 Blueprint → 选择该仓库 → 按提示填 ADMIN_PASSWORD
services:
  - type: web
    name: projecthub
    runtime: node
    plan: free                 # 免费实例：网址永久固定，但闲置 15 分钟会休眠，首次访问需等待约 30 秒
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_NICKNAME
        value: 白开水
      - key: ADMIN_PASSWORD
        sync: false            # 在 Render 控制台里填写，不写入仓库
      - key: ALLOWED_ORIGINS
        value: ""
    # 免费实例磁盘是临时的：重新部署/重启会清空 data/
    # 需要长期保存数据：升级为付费实例并启用下面的磁盘挂载
    # disk:
    #   name: projecthub-data
    #   mountPath: /app/data
    #   sizeGB: 1
